# fork-only measurement harness (agarg21/onnxruntime): upstream mac.yml reduced to the
# webgpu arm64 Debug + Release legs, dispatch-only. Not for upstream.
name: "MacOS CI Pipeline"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  python_version: "3.14"

jobs:
  webgpu:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      use_webgpu: true
      matrix_include: >-
        [
          {"machine": "arm64", "target": "arm64", "build_config": "Debug"},
          {"machine": "arm64", "target": "arm64", "build_config": "Release"}
        ]
      python_version: "3.14"
